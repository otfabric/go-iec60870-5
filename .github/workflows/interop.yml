name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-iec60870-5 against the reference implementations published by
# otfabric/iec60870-5-interop, as client and as server. The images are consumed
# as published: nothing of iec60870-5-interop is cloned or built here.

on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      lib60870_image:
        description: "lib60870 reference image (default: the pinned release)"
        required: false
      openmuc_image:
        description: "OpenMUC j60870 reference image (default: the pinned release)"
        required: false
      wendy512_image:
        description: "wendy512/iec104 reference image (default: the pinned release)"
        required: false
      cbsigma_image:
        description: "cB-Sigma/iec60870 reference image, with IEC 62351-5 (default: the pinned release)"
        required: false
      part5_image:
        description: "pascaldekloe/part5 reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # The full set of references runs here: a procedure that none of them declares
  # fails, it does not skip.
  IEC104_REQUIRE_INTEROP: "1"
  # The IEC 104 images of otfabric/iec60870-5-interop v0.4.0 (contract 2.3):
  # lib60870-C v2.4.1, OpenMUC j60870 1.8.0, wendy512/iec104 v1.0.4 on
  # go-iecp5 v1.2.6, cB-Sigma/iec60870 v0.3.0, pascaldekloe/part5 v0.3.0.
  # Keep in step with the Makefile and iec104/interop/harness.go.
  IEC104_INTEROP_LIB60870_IMAGE: ${{ inputs.lib60870_image || 'ghcr.io/otfabric/iec60870-5-interop-iec104-lib60870@sha256:adda416d5659671e28080bca361a7fb6708aa8dce1877cba8207008049d1bb04' }}
  IEC104_INTEROP_OPENMUC_IMAGE: ${{ inputs.openmuc_image || 'ghcr.io/otfabric/iec60870-5-interop-iec104-openmuc@sha256:a619fc3e15a44cff6793d1d17f6db3f8783fbb0557b79ff46bbb8280ee95e8e5' }}
  IEC104_INTEROP_WENDY512_IMAGE: ${{ inputs.wendy512_image || 'ghcr.io/otfabric/iec60870-5-interop-iec104-wendy512@sha256:03773fceb73cd6a6923209ad81fc5dbdcfff9cf538544b4067f1b21ee5b4a679' }}
  IEC104_INTEROP_CBSIGMA_IMAGE: ${{ inputs.cbsigma_image || 'ghcr.io/otfabric/iec60870-5-interop-iec104-cbsigma@sha256:f25d56f35badd81134813c6098ecf0cf63e6e8c9aec69f9e404f77cd2f626506' }}
  IEC104_INTEROP_PART5_IMAGE: ${{ inputs.part5_image || 'ghcr.io/otfabric/iec60870-5-interop-iec104-part5@sha256:6ff105c63340053a8365ce70373f0a72c514a847003046d48208a0df3f591ea6' }}

jobs:
  interop:
    name: lib60870 + OpenMUC + wendy512 + cB-Sigma + part5, client and server
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Pull reference images
        run: |
          images=("${IEC104_INTEROP_LIB60870_IMAGE}" "${IEC104_INTEROP_OPENMUC_IMAGE}" "${IEC104_INTEROP_WENDY512_IMAGE}" "${IEC104_INTEROP_CBSIGMA_IMAGE}" "${IEC104_INTEROP_PART5_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream |"
            echo "|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq --filter name=go-iec60870-5-interop); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: artifacts/
          if-no-files-found: ignore

  # IEC 60870-5-101: the client against the lib60870-C, cB-Sigma and
  # digitalpetri servers of otfabric/iec60870-5-interop v0.4.0 (contract 2.3),
  # and their clients against the server, unbalanced and balanced, with the
  # default and four other sets of field sizes. Images pinned by digest in
  # iec101/interop/harness.go.
  iec101:
    name: IEC 101 against lib60870 + cB-Sigma + digitalpetri, both directions and modes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Run the IEC 101 interop suite
        run: make interop-iec101

  # IEC 60870-5-103: the clients of vitusdong/iec103-dotnet, ARIEC103,
  # Open103 and go-iecp5 against the server, and the client against the
  # vitusdong server, of otfabric/iec60870-5-interop v0.4.0 (contract 2.3),
  # pinned by digest in iec103/interop/harness.go.
  iec103:
    name: IEC 103 against vitusdong + ARIEC103 + Open103 + go-iecp5, both directions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Run the IEC 103 interop suite
        run: make interop-iec103

  # IEC 60870-5-102: the client of gisce/iec870ree (REE profile) of
  # otfabric/iec60870-5-interop v0.4.0 (contract 2.3) against iec102/server.
  # The image is pinned by digest in iec102/interop/harness.go.
  iec102:
    name: IEC 102 against gisce/iec870ree (server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Run the IEC 102 interop suite
        run: make interop-iec102

  # The application-layer security (IEC 62351-5) against cB-Sigma/iec60870,
  # in process: interop/cbsigma is a module of its own, so that go-iec60870-5
  # keeps no dependencies, and cB-Sigma needs Go 1.26.
  cbsigma:
    name: cB-Sigma (IEC 62351-5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: iec104/interop/cbsigma/go.sum
      - run: make test-cbsigma
