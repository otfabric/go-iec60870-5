# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.8.0
    with:
      # otfabric-policy runs in docs.yml, on every pull request and push to main.
      run-policy: false
      run-govulncheck: true
      coverage-min: "90"
      fuzz-time: 10s
      # Same scope as TEST_PKGS in the Makefile: the fixture and test helper packages have no tests of their own.
      test-exclude-regex: "/example(s)?($|/)|/internal/(station|testutil)$"
      codecov-name: go-iec60870-5
      # Coverage across the production packages, as make coverage measures it: the
      # e2e suite exercises them. make coverpkg-check keeps it equal to COVER_PKGS.
      coverpkg: github.com/otfabric/go-iec60870-5,github.com/otfabric/go-iec60870-5/asdu,github.com/otfabric/go-iec60870-5/cp,github.com/otfabric/go-iec60870-5/ft12,github.com/otfabric/go-iec60870-5/iec101,github.com/otfabric/go-iec60870-5/iec101/client,github.com/otfabric/go-iec60870-5/iec101/server,github.com/otfabric/go-iec60870-5/iec102,github.com/otfabric/go-iec60870-5/iec102/client,github.com/otfabric/go-iec60870-5/iec102/ree,github.com/otfabric/go-iec60870-5/iec102/server,github.com/otfabric/go-iec60870-5/iec103,github.com/otfabric/go-iec60870-5/iec103/client,github.com/otfabric/go-iec60870-5/iec103/server,github.com/otfabric/go-iec60870-5/iec104,github.com/otfabric/go-iec60870-5/iec104/apci,github.com/otfabric/go-iec60870-5/iec104/client,github.com/otfabric/go-iec60870-5/iec104/internal/link,github.com/otfabric/go-iec60870-5/iec104/server,github.com/otfabric/go-iec60870-5/internal/logx,github.com/otfabric/go-iec60870-5/internal/pcapio,github.com/otfabric/go-iec60870-5/internal/serialcap,github.com/otfabric/go-iec60870-5/link,github.com/otfabric/go-iec60870-5/sec,github.com/otfabric/go-iec60870-5/telecontrol
      go-versions: '["1.26", "1.27"]'
    secrets: inherit

  # go-ci gates the total; this gates each package (COVER_PKG_MIN).
  coverage-floor:
    name: Per-package coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: make coverpkg-check coverage-pkg-check

  # The committed captures are byte-identical to their sources.
  captures:
    name: Captures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make captures-verify

  # The self-contained examples must keep running as they are.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: make build examples
