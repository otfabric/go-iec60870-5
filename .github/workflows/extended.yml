name: Extended
run-name: "Extended (${{ github.event_name }}) on ${{ github.ref_name }}"

# What is too long for every push: each fuzz target for minutes instead of
# seconds, and the chaos test with many more seeds.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Duration of each fuzz target
        required: false
        default: 5m
      chaos_seeds:
        description: Number of chaos seeds, of 30 seconds each
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Go 1.26 has a fuzz coordinator race at the end of -fuzztime
      # (go.dev/issue/75804): fuzz on the current stable Go, as go-ci does.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # The dispatch input reaches the shell through the environment and
      # must be a Go -fuzztime value: a duration (5m, 1h30m) or a count (100x).
      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: |
          if ! [[ "$FUZZTIME" =~ ^([0-9]+[hms])+$|^[0-9]+x$ ]]; then
            echo "::error::fuzztime must be a duration such as 5m or a count such as 100x"
            exit 1
          fi
          make fuzz FUZZTIME="$FUZZTIME"
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/"
          if-no-files-found: ignore

  # One job per suite: IEC 104 over TCP, the serial standards over a faulty
  # in-memory line. IEC 101 runs every seed unbalanced and balanced, twice
  # the time of the others.
  chaos:
    name: Chaos ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        suite: [iec104, iec101, iec102, iec103]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The dispatch input reaches the shell through the environment and
      # must be a number of seeds.
      - name: Chaos
        env:
          CHAOS_SEEDS: ${{ inputs.chaos_seeds || '20' }}
          SUITE: ${{ matrix.suite }}
        run: |
          if ! [[ "$CHAOS_SEEDS" =~ ^[0-9]+$ ]]; then
            echo "::error::chaos_seeds must be a number"
            exit 1
          fi
          make chaos CHAOS_PKGS="./$SUITE/e2e/" CHAOS_SEEDS="$CHAOS_SEEDS"
